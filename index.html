<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Longitudinal and transverse magnetization with repeated 90-degree excitations.">
  <title>Repetition time</title>
  <style>:root { color-scheme: dark; --bg: #171717; --text: #ededeb; --muted: #b6b6b2; --rule: #535350; --accent: #c5dbb6; font-family: Arial, Helvetica, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
main { max-width: 1120px; margin: 0 auto; padding: 26px 36px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; border-bottom: 4px double var(--rule); padding-bottom: 16px; }
.brand { font: bold 38px Georgia, 'Times New Roman', serif; letter-spacing: -1px; }
.tag { color: var(--muted); font-size: 13px; }
.intro { padding: 26px 0 22px; }
h1, h2 { font-family: Georgia, 'Times New Roman', serif; }
h1 { font-size: 36px; line-height: 1.15; margin: 0 0 12px; }
h2 { font-size: 23px; line-height: 1.3; margin: 0 0 14px; }
p { font: 16px/1.55 Georgia, 'Times New Roman', serif; margin: 0 0 14px; color: var(--muted); }
.lead { max-width: 760px; font-size: 18px; }
.controls { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 20px 0; }
.control-title { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
.control-title label { font-size: 16px; font-weight: bold; }
.control-title label span { font-weight: normal; margin-left: 5px; }
.number-wrap { display: flex; align-items: center; gap: 8px; }
.number-wrap input { width: 100px; font: 20px Arial, sans-serif; }
.number-wrap span { font-size: 14px; color: var(--muted); }
input[type=number] { padding: 6px 8px; background: #252525; color: var(--text); border: 1px solid #71716b; border-radius: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
.range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
.control-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
button { background: #262626; border: 1px solid #656561; border-radius: 0; padding: 7px 12px; color: var(--text); font: 13px Arial, sans-serif; cursor: pointer; }
button:hover { background: #353535; }
button.active { background: #deded8; color: #161616; border-color: #deded8; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.switch input { accent-color: var(--accent); }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; padding: 20px 0; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 3px; background: var(--color); }
.legend .pulse-key { margin-left: auto; color: var(--muted); }
.legend .pulse-key i { width: 2px; height: 12px; background: var(--accent); }
.plots { display: grid; gap: 24px; }
.plot-card { border-top: 1px solid var(--rule); padding-top: 16px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font: 12px Arial, sans-serif; fill: var(--muted); }
sub { font-size: .65em; }
.details { display: grid; grid-template-columns: 1fr; gap: 32px; border-top: 3px double var(--rule); margin-top: 28px; padding-top: 22px; }
aside { border-left: 1px solid var(--rule); padding-left: 26px; }
.table-scroll { overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 18px 0; }
th { text-align: left; padding: 9px 5px; border-bottom: 2px solid var(--rule); font-weight: bold; white-space: nowrap; }
th span { font-weight: normal; color: var(--muted); }
td { padding: 11px 5px; border-bottom: 1px solid #41413e; }
td:first-child { white-space: nowrap; }
td input { width: 70px; font: 13px Arial, sans-serif; }
td:last-child { font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; }
.text-button { background: transparent; font-size: 12px; }
.formula { font: 15px/2.2 Georgia, 'Times New Roman', serif; margin: 15px 0; color: var(--text); }
a { color: var(--text); text-underline-offset: 3px; }
.source { font-size: 13px; }
footer { border-top: 1px solid var(--rule); margin-top: 28px; padding-top: 16px; font-size: 12px; color: var(--muted); }
@media (max-width: 800px) { main { padding: 20px; } .brand { font-size: 30px; } .control-bottom { align-items: flex-start; flex-direction: column; } .details { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--rule); padding: 20px 0 0; } .legend { gap: 16px; } .legend .pulse-key { margin-left: 0; } }
@media (max-width: 480px) { main { padding: 16px; } header { flex-direction: column; gap: 6px; } h1 { font-size: 30px; } h2 { font-size: 20px; } .lead { font-size: 16px; } td input { width: 60px; } }
</style>
</head>
<body>
  <main>
    <section class="controls" aria-label="Simulation controls">
      <div class="control-title"><label for="tr">Repetition time <span>TR</span></label><div class="number-wrap"><input id="tr" type="number" min="10" max="3000" step="1" value="3000"><span>ms</span></div></div>
      <input id="tr-slider" type="range" min="10" max="3000" step="1" value="3000" aria-label="Repetition time in milliseconds">
      <div class="range-labels"><span>10 ms</span><span>3000 ms</span></div>
      <div class="control-bottom"><label class="switch"><input id="steady" type="checkbox" checked> Start in steady state</label></div>
    </section>
    <div class="legend"><span><i style="--color:#51cd83"></i>White matter</span><span><i style="--color:#69a9ff"></i>Gray matter</span><span><i style="--color:#ffaf59"></i>CSF</span><span class="pulse-key"><i></i>90° excitation</span></div>
    <section class="plots">
      <article class="plot-card"><h2>Longitudinal magnetization, M<sub>z</sub></h2><svg id="mz" viewBox="0 0 960 300" role="img" aria-label="Longitudinal magnetization over 3000 milliseconds"></svg></article>
      <article class="plot-card"><h2>Transverse magnetization, |M<sub>xy</sub>|</h2><svg id="mxy" viewBox="0 0 960 300" role="img" aria-label="Transverse magnetization magnitude over 3000 milliseconds"></svg></article>
    </section>
    <section class="details"><div class="parameters"><h2>Tissue parameters</h2><div class="table-scroll"><table><thead><tr><th>Tissue</th><th>T1 <span>ms</span></th><th>T2 <span>ms</span></th><th>Density</th><th>M<sub>z</sub> before pulse</th></tr></thead><tbody id="tissues"></tbody></table></div><button id="reset" class="text-button">Reset tissue parameters</button></div></section>
  </main>
  <script>(() => {
'use strict';
const WINDOW_MS = 3000;

// On-resonance, ideal 90-degree excitation, with transverse spoiling before
// each pulse. Density sets M0; all times are milliseconds.
function recovery(tissue, elapsed) {
  return tissue.pd * -Math.expm1(-elapsed / tissue.t1);
}

function sample(tissue, time, tr, steady = false) {
  const cycle = Math.floor(time / tr);
  const elapsed = time - cycle * tr;
  const amplitude = cycle === 0 && !steady ? tissue.pd : recovery(tissue, tr);
  return { mz: recovery(tissue, elapsed), mxy: amplitude * Math.exp(-elapsed / tissue.t2) };
}

// Include both sides of pulse discontinuities explicitly, even for a TR
// smaller than the nominal drawing step.
function series(tissue, tr, steady = false, windowMs = WINDOW_MS) {
  const points = [];
  for (let start = 0, cycle = 0; start < windowMs; start += tr, cycle++) {
    const end = Math.min(start + tr, windowMs);
    const amplitude = cycle === 0 && !steady ? tissue.pd : recovery(tissue, tr);
    const count = Math.max(2, Math.ceil((end - start) / 2));
    for (let i = 0; i <= count; i++) {
      const elapsed = (end - start) * i / count;
      points.push({ t: start + elapsed, mz: recovery(tissue, elapsed), mxy: amplitude * Math.exp(-elapsed / tissue.t2) });
    }
  }
  // A pulse exactly on the right boundary is still an excitation.
  if (windowMs % tr === 0) points.push({ t: windowMs, ...sample(tissue, windowMs, tr, steady) });
  return points;
}


const defaults = [
  { name: 'White matter', t1: 790, t2: 92, pd: 1, color: '#51cd83' },
  { name: 'Gray matter', t1: 920, t2: 101, pd: 0.86, color: '#69a9ff' },
  { name: 'CSF', t1: 2569, t2: 329, pd: 1, color: '#ffaf59' },
];
let tissues = defaults.map(t => ({ ...t }));
let tr = WINDOW_MS;
const number = document.querySelector('#tr');
const slider = document.querySelector('#tr-slider');
const steady = document.querySelector('#steady');
const tbody = document.querySelector('#tissues');

function table() {
  tbody.innerHTML = tissues.map((t, i) => `<tr><td><span class="dot" style="background:${t.color}"></span>${t.name}</td>${['t1', 't2', 'pd'].map(key => `<td><input type="number" value="${t[key]}" min="${key === 'pd' ? 0 : 1}" max="${key === 'pd' ? 2 : 20000}" step="${key === 'pd' ? 0.01 : 1}" data-i="${i}" data-key="${key}" aria-label="${t.name} ${key === 'pd' ? 'relative proton density' : key.toUpperCase() + ' in milliseconds'}"></td>`).join('')}<td data-recovery="${i}"></td></tr>`).join('');
}

function graph(id, data) {
  const left = 58, right = 940, top = 22, bottom = 252;
  const max = Math.max(1, ...tissues.map(t => t.pd));
  const x = t => left + t / WINDOW_MS * (right - left);
  const y = v => bottom - v / max * (bottom - top);
  let html = `<title>${id === 'mz' ? 'Longitudinal recovery' : 'Transverse decay'} with TR ${tr} ms</title><defs><clipPath id="clip-${id}"><rect x="${left}" y="${top - 1}" width="${right - left}" height="${bottom - top + 2}"/></clipPath></defs>`;
  for (let i = 0; i <= 4; i++) {
    const value = max * i / 4;
    html += `<line x1="${left}" x2="${right}" y1="${y(value)}" y2="${y(value)}" stroke="#41413e" stroke-width="1"/><text x="${left - 12}" y="${y(value) + 4}" text-anchor="end">${(value * 100).toFixed(0)}</text>`;
  }
  for (let t = 0; t <= WINDOW_MS; t += 500) html += `<text x="${x(t)}" y="${bottom + 24}" text-anchor="middle">${t}</text>`;
  html += `<text x="${(left + right) / 2}" y="${bottom + 46}" text-anchor="middle">Time (ms)</text><text transform="translate(15,${(top + bottom) / 2}) rotate(-90)" text-anchor="middle">Magnetization (% of M₀ = 1)</text><g clip-path="url(#clip-${id})">`;
  for (let t = 0; t <= WINDOW_MS; t += tr) html += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${bottom}" stroke="#c5dbb6" stroke-opacity=".4" stroke-dasharray="4 5"/>`;
  if (id === 'mz') tissues.forEach((t, i) => {
    html += `<line x1="${left}" x2="${right}" y1="${y(t.pd)}" y2="${y(t.pd)}" stroke="${t.color}" stroke-width="1" stroke-opacity=".7" stroke-dasharray="3 6" stroke-dashoffset="${i * 3}"><title>${t.name} proton density: ${t.pd}</title></line>`;
  });
  tissues.forEach((t, i) => {
    const path = data[i].map((p, j) => `${j ? 'L' : 'M'}${x(p.t).toFixed(2)},${y(p[id]).toFixed(2)}`).join(' ');
    html += `<path d="${path}" fill="none" stroke="${t.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  });
  html += '</g>';
  document.querySelector(`#${id}`).innerHTML = html;
}

function render() {
  const data = tissues.map(t => series(t, tr, steady.checked));
  graph('mz', data);
  graph('mxy', data);
  tissues.forEach((t, i) => { document.querySelector(`[data-recovery="${i}"]`).textContent = `${(100 * recovery(t, tr)).toFixed(1)}%`; });
}

function setTR(value) {
  if (!Number.isFinite(value)) return;
  tr = Math.max(10, Math.min(WINDOW_MS, Math.round(value)));
  number.value = slider.value = tr;
  render();
}
number.addEventListener('input', () => { if (number.value !== '' && number.valueAsNumber >= 10 && number.valueAsNumber <= WINDOW_MS) setTR(number.valueAsNumber); });
number.addEventListener('change', () => setTR(number.valueAsNumber || tr));
slider.addEventListener('input', () => setTR(slider.valueAsNumber));
steady.addEventListener('change', render);
tbody.addEventListener('input', event => {
  const input = event.target;
  if (!input.matches('input') || !input.validity.valid || input.value === '') return;
  tissues[+input.dataset.i][input.dataset.key] = input.valueAsNumber;
  render();
});
tbody.addEventListener('change', event => { const input = event.target; if (input.matches('input')) input.value = tissues[+input.dataset.i][input.dataset.key]; });
document.querySelector('#reset').addEventListener('click', () => { tissues = defaults.map(t => ({ ...t })); table(); render(); });
table();
render();

})();</script>
</body>
</html>
